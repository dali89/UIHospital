<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Reports - MediLab Hospital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="addward.css">

</head>

<body>
  <div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>🏥 MediLab</h2>
        <p>Admin Panel</p>
      </div>

      <ul class="menu">
        <li><a href="dashboardadmin.html">Dashboard</a></li>
        <li><a href="patient.html">Patients</a></li>
        <li><a href="staff.html">Staff</a></li>
        <li class="active"><a href="doctor.html">Doctors</a></li>
        <li><a href="departments.html">Departments</a></li>
        <li><a href="lab.html">Lab</a></li>
        <li><a href="ward.html">Ward</a></li>
        <li><a href="report.html">Reports</a></li>
        <li><a href="invoice1.html">Invoice</a></li>
        <li><a href="feedback.html">Feedback</a></li>
        <li><a href="settings.html">Settings</a></li>
        <li><a href="logout.html">Logout</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">

      <header class="topbar">
        <div class="welcome-box">
          <h3>Doctor Management</h3>
          <p>Enter doctor details below</p>
        </div>

        <div class="user-profile">
          <span class="username">Admin</span>
          <img src="https://via.placeholder.com/45" alt="Admin" class="avatar">
        </div>
      </header>

      <div class="panel-box">
        <h2 class="title">Doctor Details</h2>

        <form class="doctor-form">

          <div class="form-grid">

            <div class="form-group">
              <label>Doctor Name</label>
              <input type="text" placeholder="Enter doctor full name">
            </div>

            <div class="form-group">
              <label>Specialization</label>
              <select>
                <option>Select specialization</option>
                <option>Cardiologist</option>
                <option>Dermatologist</option>
                <option>Neurologist</option>
                <option>Orthopedic</option>
                <option>Pediatrician</option>
                <option>Oncologist</option>
              </select>
            </div>

            <div class="form-group">
              <label>Experience (Years)</label>
              <input type="number" placeholder="Enter experience">
            </div>

            <div class="form-group">
              <label>Phone</label>
              <input type="number" placeholder="Enter phone number">
            </div>

            <div class="form-group">
              <label>Email</label>
              <input type="email" placeholder="Enter email">
            </div>

            <div class="form-group">
              <label>Consultation Fee</label>
              <input type="number" placeholder="₹ Amount">
            </div>

            <div class="form-group full">
              <label>Address</label>
              <textarea placeholder="Enter doctor address"></textarea>
            </div>

          </div>

          <div class="form-actions">
            <button class="main-btn">Save Doctor</button>
            <button type="reset" class="cancel-btn">Cancel</button>
          </div>

        </form>
      </div>

    </main>
  </div>
</body>
</html>
