<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Invoice - MediLab</title>
  <link rel="stylesheet" href="addward.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>🏥 MediLab</h2>
        <p>Admin Panel</p>
      </div>

      <ul class="menu">
         <li  ><a href="dashboardadmin.html">Dashboard</a></li>
        <li><a href="patient.html">Patients</a></li>
        <li><a href="staff.html">Staff</a></li>
        <li><a href="doctor.html">Doctors</a></li>
          <li><a href="departments.html">Departments</a></li>
        <li><a href="dashboardphar.html">Pharmacy</a></li>
          <li><a href="appointments.html">Appointments</a></li>
       
        <li><a href="lab.html">Lab</a></li>
        <li><a href="ward.html">Ward</a></li>
        <li><a href="report.html">Reports</a></li>
        <li class="active"><a href="invoice1.html">Invoice</a></li>
         <li><a href="feedback.html">Feedback</a></li>
        <li><a href="settings.html">Settings</a></li>
        <li><a href="logout.html">Logout</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="topbar">
        <div class="welcome-box">
          <h3>Invoice Management</h3>
          <p>Manage all invoice records</p>
        </div>

        <div class="user-profile">
          <span class="username">Admin</span>
          <img src="https://via.placeholder.com/45" alt="Admin Avatar" class="avatar">
        </div>
      </header>

      <div class="panel-box">

        <form class="invoice-form">

          <div class="form-grid">

            <div class="form-group">
              <label>Invoice ID</label>
              <input type="text" placeholder="INV0001">
            </div>

            <div class="form-group">
              <label>Patient Name</label>
              <input type="text" placeholder="Enter patient name">
            </div>

            <div class="form-group">
              <label>Service Type</label>
              <select>
                <option>Select Service</option>
                <option>Consultation</option>
                <option>Medicine</option>
                <option>Lab Test</option>
                <option>Room Charges</option>
              </select>
            </div>

            <div class="form-group">
              <label>Total Amount</label>
              <input type="number" placeholder="₹ Amount">
            </div>

            <div class="form-group">
              <label>Payment Mode</label>
              <select>
                <option>Cash</option>
                <option>Card</option>
                <option>UPI</option>
                <option>Net Banking</option>
              </select>
            </div>

            <div class="form-group">
              <label>Date</label>
              <input type="date">
            </div>

            <div class="form-group full">
              <label>Notes</label>
              <textarea placeholder="Extra details..."></textarea>
            </div>

          </div>

          <div class="form-actions">
            <button class="main-btn">Generate Invoice</button>
            <button type="reset" class="cancel-btn">Clear</button>
          </div>

        </form>
      </div>

    </main>

  </div>
</body>
</html>
