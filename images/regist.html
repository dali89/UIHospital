
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediLab - Registration</title>
  <link rel="stylesheet" href="regist.css">
</head>
<body>
  <div class="registration-container">
    <div class="form-box">
      
      <!-- Left Info Section -->
      <div class="info-section">
        <h2>🏥 MediLab Hospital</h2>
        <p>Register to access our hospital management system and services.</p>
      </div>

      <!-- Registration Form -->
      <div class="form-section">
        <h3>Registration Form</h3>
        <form class="register-form">

          <div class="form-row">
            <input type="text" placeholder="First Name" required>
            <input type="text" placeholder="Last Name" required>
          </div>

          <div class="form-row">
            <input type="email" placeholder="Email" required>
            <input type="text" placeholder="Mobile Number" required>
          </div>

          <div class="form-row">
            <input type="text" placeholder="NIC" required>
            <input type="date" placeholder="Date of Birth" required>
          </div>

          <div class="form-row">
            <select required>
              <option value="">Gender</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
            <select required>
              <option value="">Role</option>
              <option>Doctor</option>
              <option>Nurse</option>
              <option>Receptionist</option>
              <option>Pharmacist</option>
              <option>Lab Staff</option>
            </select>
          </div>

          <div class="form-row">
            <textarea placeholder="Address" required></textarea>
          </div>

          <div class="form-row">
            <input type="password" placeholder="Password" required>
            <input type="password" placeholder="Confirm Password" required>
          </div>

          <button type="submit" class="register-btn">Register</button>

          <p class="signin-text">
            Already registered? <a href="signin.html">Go to Sign IN</a>
          </p>
        </form>
      </div>
      </div>

        <div class="image-section">
    <img src="Hom5.png" alt="Hospital Image">
  </div>

    
  </div>
</body>
</html>
