<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile – MediLab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="patient.css">
</head>
<body>

<div class="container">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>🏥 MediLab</h2>
      <p>Doctor Panel</p>
    </div>

    <ul class="menu">
      <li><a href="dashboarddoctor.html">Dashboard</a></li>
      <li><a href="patient1.html">My Patients</a></li>
      <li><a href="appoint.html">Appointments</a></li>
      <li><a href="prescription.html">Prescriptions</a></li>
      <li><a href="labreport.html">Lab Reports</a></li>
      <li><a href="ward.html">Wards</a></li>
      <li class="active"><a href="profile.html">Profile</a></li>
      <li><a href="message.html">Message</a></li>
      <li><a href="setting.html">Settings</a></li>
      <li><a href="logout.html">Logout</a></li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <div class="topbar">
      <div class="welcome-box">
        <h3>Edit Profile</h3>
        <p>Update your personal information</p>
      </div>

      <div class="user-profile">
        <span class="username">Dr. Madhusha</span>
        <img src="https://via.placeholder.com/50" class="avatar">
      </div>
    </div>

    <!-- Profile Box -->
    <div class="panel-box">
      <div class="box-header">
        <h3>Profile Details</h3>
      </div>

      <form class="profile-form">

        <div class="profile-photo-area">
          <img src="https://via.placeholder.com/120" class="profile-pic">
          <input type="file" id="upload" hidden>
          <label for="upload" class="upload-btn">Change Photo</label>
        </div>

        <div class="form-grid">

          <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter full name" value="Dr. Madhusha">
          </div>

          <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="example@mail.com">
          </div>

          <div class="form-group">
            <label>Phone</label>
            <input type="text" placeholder="+91 9876543210">
          </div>

          <div class="form-group">
            <label>Specialization</label>
            <input type="text" placeholder="e.g. Cardiologist">
          </div>

          <div class="form-group">
            <label>Experience</label>
            <input type="number" placeholder="Years of experience">
          </div>

          <div class="form-group">
            <label>Address</label>
            <input type="text" placeholder="Enter full address">
          </div>

        </div>

        <div class="form-group full">
          <label>About</label>
          <textarea placeholder="Short description about you..."></textarea>
        </div>

        <div class="form-actions">
          <!-- <button type="submit" class="main-btn">Save Changes</button>
          <a href="profile.html" type="reset" class="cancel-btn">Cancel</a> -->

              <button class="main-btn" type="submit">Save Changes</button>
<button class="cancel-btn" onclick="window.location.href='profile.html'" type="reset">Cancel</button>
        </div>

      </form>
    </div>

  </main>

</div>

</body>
</html>
