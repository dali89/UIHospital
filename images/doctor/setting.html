<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Settings - MediLab Hospital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="setting.css">
</head>

<body>

<div class="container">

   <aside class="sidebar">
    <div class="sidebar-header">
      <h2>🏥 MediLab</h2>
      <p>Doctor Panel</p>
    </div>

    <ul class="menu">
      <li><a href="dashboarddoctor.html">Dashboard</a></li>
      <li><a href="patient1.html">My Patients</a></li>
      <li><a href="appoint.html">Appointments</a></li>
      <li><a href="prescription.html">Prescriptions</a></li>
      <li><a href="labreport.html">Lab Reports</a></li>
      <li><a href="ward.html">Wards</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li><a href="message.html">Messages</a></li>
      <li class="active"><a href="setting.html">Settings</a></li>
      <li><a href="logout.html">Logout</a></li>
    </ul>
  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <h2>⚙️ Settings</h2>
    <p class="subtitle">Manage your account, profile and security preferences</p>

    <div class="settings-grid">

      <!-- Profile Update -->
      <div class="settings-card">
        <h3>👨‍⚕️ Profile Information</h3>

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" value="Dr. Madhusha">
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" value="doctor@gmail.com">
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" value="+91 9876543210">
        </div>

        <div class="form-group">
          <label>Specialization</label>
          <input type="text" value="Cardiologist">
        </div>

        <button class="save-btn">Save Changes</button>
      </div>

      <!-- Password Update -->
      <div class="settings-card">
        <h3>🔐 Change Password</h3>

        <div class="form-group">
          <label>Current Password</label>
          <input type="password" placeholder="Enter current password">
        </div>

        <div class="form-group">
          <label>New Password</label>
          <input type="password" placeholder="Enter new password">
        </div>

        <div class="form-group">
          <label>Confirm New Password</label>
          <input type="password" placeholder="Re-enter new password">
        </div>

        <button class="save-btn">Update Password</button>
      </div>

    </div>

  </main>

</div>

</body>
</html>
